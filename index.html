<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A* Visualize</title>
        <script src="index.js" type="module" defer></script>
        <style>
            table {
                border-collapse: collapse;
                user-select: none;
            }

            td {
                width: 1.5rem;
                height: 1.5rem;
                text-align: center;
                border: 1px solid black;
                color: transparent;
            }

            td.weighted {
                color: black;
            }

            td.visited {
                background-color: #d3d3d3;
            }

            td.path {
                background-color: black;
            }

            td.path.weighted {
                color: white;
            }

            td.start {
                background-color: #3a822a;
            }

            td.goal {
                background-color: #a69c16;
            }

            td.wall {
                background-color: gray !important;
            }

            button {
                border: 1px solid black;
            }

            #add,
            #remove {
                width: 1.5rem;
                height: 1.5rem;
            }

            #add.active {
                background-color: #32a852;
            }

            #remove.active {
                background-color: #c41621;
            }
        </style>
    </head>
    <body>
        <table></table>
        <p>Wall <button id="add">+</button> <button id="remove">-</button></p>
        <p>
            <input type="number" id="width" min="1" value="30" />
            <input type="number" id="height" min="1" value="30" />
        </p>
        <p>
            <button id="astar">Run A*</button>
            <button id="dijkstra">Run Dijkstra</button>
            <button id="reset">Clear path</button>
            <button id="reset-all">Reset</button>
        </p>
        <p>
            <button id="toggle-weight">Toggle Weight</button>
            <button id="regen-weight">Regenerate Weight</button>
        </p>
        <p>Cost of the path: <span id="cost"></span></p>
    </body>
</html>
