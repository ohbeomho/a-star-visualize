<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A* Visualize</title>
        <script src="index.js" type="module" defer></script>
        <style>
            table {
                border-collapse: collapse;
            }

            td {
                width: 1.5rem;
                height: 1.5rem;
                text-align: center;
                border: 1px solid black;
                color: transparent;
            }

            td.weighted {
                color: black;
            }

            td.visited {
                background-color: #d3d3d3;
            }

            td.path {
                background-color: black;
            }

            td.path.weighted {
                color: white;
            }

            td.start {
                background-color: #3a822a;
            }

            td.goal {
                background-color: #a69c16;
            }
        </style>
    </head>
    <body>
        <table></table>
        <p>
            <button id="astar">Run A*</button>
            <button id="dijkstra">Run Dijkstra</button>
            <button id="reset">Reset</button>
        </p>
        <p>
            <button id="toggle-weight">Toggle Weight</button>
            <button id="regen-weight">Regenerate Weight</button>
        </p>
        <p>Cost of the path: <span id="cost"></span></p>
    </body>
</html>
